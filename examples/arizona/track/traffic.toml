# Multi-source empirical endurance traffic model (Arizona frequency calibration).
#
# This file is resolved into studies/baseline.toml at project-load time. The
# uncertainty tables below use the same UncertainQuantity schema as vehicle,
# driver, track, and obstacle parameters. Each [[observations]] entry is one
# measured traffic encounter; event duration and speed fraction are bootstrapped
# together so their empirical relationship is preserved. Competitor last-lap data
# below provides the empirical four-hour field-survival curve used for frequency.
#
# timestamp may be m:ss or h:mm:ss. speed_fraction is the fraction of unobstructed
# speed retained during the encounter (0 = stop, 1 = no speed reduction).

race_duration_s = 14400.0
fit_bin_s = 900.0
minimum_reference_speed_mps = 2.0

[race_time_fraction]
nominal = 0.5
unit = "1"

[race_time_fraction.source]
kind = "derived"
reference = "Representative endurance lap sampled uniformly across the 4 h race"
notes = "0 is race start and 1 is race end."

[race_time_fraction.uncertainty]
distribution = "uniform"
role = "measured_track"
lower = 0.0
upper = 1.0
reason = "Traffic exposure depends strongly on when the representative lap occurs."

[rate_scale]
nominal = 1.0
unit = "1"

[rate_scale.source]
kind = "calibrated"
reference = "Arizona 2025 CWRU + ETS independent observer-stream bootstrap"
notes = "Applied multiplicatively to the fitted encounter intensity; observer exposure is handled independently by race_id/observer_id."

[rate_scale.uncertainty]
distribution = "empirical"
role = "measured_track"
samples = [0.6206, 0.7047, 0.7588, 0.7954, 0.8306, 0.8647, 0.8898, 0.9104, 0.9331, 0.9497, 0.9762, 1.0049, 1.0255, 1.0515, 1.0766, 1.1100, 1.1405, 1.1722, 1.2306, 1.3108, 1.4488]
reason = "Bootstrap of independent Arizona CWRU and ETS event streams plus competitor survival; captures finite event counts and observer-to-observer rate variation."


[field_exponent]
nominal = 6.515
unit = "1"

[field_exponent.source]
kind = "calibrated"
reference = "Arizona 2025 independent observer exposure versus empirical competitor survival"
notes = "Poisson profile-likelihood fit of lambda(t)=lambda0*S(t)^alpha using separate CWRU/ETS observer exposures and the Arizona Kaplan-Meier competitor survival curve."

[field_exponent.uncertainty]
distribution = "empirical"
role = "measured_track"
samples = [1.7098, 2.6643, 3.3000, 3.6833, 4.2078, 4.5224, 4.9769, 5.3614, 5.7719, 6.1000, 6.4300, 6.7695, 7.1800, 7.6300, 8.1000, 8.7376, 9.4786, 10.3834, 11.3312, 13.0214, 15.0000]
reason = "Bootstrap of the two independent Arizona observer streams and 59 competitor last-lap records, including Poisson event-count uncertainty and uncertainty between the final completed lap and actual retirement point."

[duration_scale]
nominal = 1.0
unit = "1"

[duration_scale.source]
kind = "engineering_estimate"
reference = "Pooled Maryland + Arizona traffic-duration observations"
notes = "Multiplies bootstrapped measured event durations."

[duration_scale.uncertainty]
distribution = "triangular"
role = "measured_track"
lower = 0.85
mode = 1.0
upper = 1.15
reason = "Measured events are a finite sample of possible traffic durations."

[severity_scale]
nominal = 1.0
unit = "1"

[severity_scale.source]
kind = "engineering_estimate"
reference = "Pooled Maryland + Arizona traffic speed-reduction observations"
notes = "Scales the reduction 1-speed_fraction, not the retained speed itself."

[severity_scale.uncertainty]
distribution = "triangular"
role = "measured_track"
lower = 0.85
mode = 1.0
upper = 1.15
reason = "Video-estimated traffic speed fractions have finite-sample and judgement uncertainty."

[field_population]
race_id = "arizona_2025"
method = "kaplan_meier_active_duration"
dropout_offset_fraction = 0.5
source_archive = "Lap Time Data-20260809T100506Z-1-001.zip"
unique_car_count_in_archive = 68
car_count_with_completed_laps = 59
excluded_no_completed_lap_count = 9
notes = "Active duration is measured from estimated first-lap start to final recorded lap crossing. Cars crossing at/after the estimated four-hour mark are right-censored. Non-finishers use a nominal retirement time halfway through one additional lap because the final completed lap precedes the actual dropout point."

