race_id = "maryland_2025"
observer_id = "maryland_observer_1"
source_dataset = "Maryland 2025 Traffic Data"
exposure_start_s = 0.0
exposure_end_s = 3600.0
frequency_fit_enabled = false
notes = "Retained for duration/severity only; no Maryland field-survival dataset is declared here."

