[traffic]
enabled = true
schema_version = 4
race_duration_s = 14400.0
bootstrap_replicates = 512
bootstrap_seed = 20260815
arrival_model = "homogeneous_poisson"
generation_rate_mode = "pooled_common_rate"
mark_model = "target_joint_empirical_resampling"
application = "full_uncertainty_and_design_only"
source_race_id = "maryland_2025"
target_race_id = "maryland_2025"

# Maryland has one reviewed one-hour traffic stream. Its own event count sets the
# arrival rate and its own complete events supply type, duration and retained-speed
# marks. No Arizona event, rate, severity or field-survival data are used here.
[[traffic.source_observation_streams]]
id = "MARYLAND"
file = "track/traffic/maryland_2025_traffic_observations.csv"
exposure_start_s = 0.0
exposure_end_s = 3600.0
