
[[runs]]
file = "gpx/MCMASTER.gpx"
run_id = "mcmaster_maryland_endurance"
vehicle_id = "mcmaster"
driver_id = "mcmaster_driver"
use_for_centreline = true
use_for_gate_evidence = true

[[runs]]
file = "gpx/ETS.gpx"
run_id = "ets_78_maryland_reconstructed"
vehicle_id = "ets_78"
driver_id = "ets_78_driver"
use_for_centreline = true
use_for_gate_evidence = false

# ETS has geometry/elevation but no native timestamps. Reconstructed timing is
# used to make complete laps eligible for route/centreline analysis. Its speed
# remains excluded from gate evidence by use_for_gate_evidence = false.
[runs.lap_time_reconstruction]
enabled = true
lap_times_file = "lap_times/78_Baja_ETS.csv"
lap_time_column = "lap_time_s"
alignment_mode = "strict_index"
expected_point_period_s = 1.0
maximum_point_period_error_fraction = 0.35
minimum_csv_lap_time_s = 180.0
maximum_csv_lap_time_s = 420.0
minimum_points_per_lap = 30
minimum_matched_laps = 20
allow_unmatched_laps = true
gate_radius_m = 8.0
export_augmented_gpx = true
